name: Stock market ML research

on:
  pull_request:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (synthetic prices)
        run: python -m unittest discover -s tests -v
      - name: Download history (2000 onward)
        run: python -m src.data --start 2000-01-01 --delay 2
      - name: Initial single-stock baseline
        run: python -m src.model --fee-bps 10
      - name: V2 daily walk-forward portfolio
        run: python -m src.walk_forward --fee-bps 10
      - name: V3 weekly benchmark-relative rotation
        run: python -m src.v3 --fee-bps 10
      - name: Upload metrics and reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-ml-metrics
          path: |
            reports/**/*.json
            reports/*.json
            data/metadata/download_summary.json
          retention-days: 14
          if-no-files-found: warn
